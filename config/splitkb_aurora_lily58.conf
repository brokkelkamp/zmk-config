# Uncomment these two line to add support for encoders to your firmware
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Enable pointing (mouse) support for scroll wheel
CONFIG_ZMK_POINTING=y

# Smooth scrolling stays off so each encoder scroll unit is one full wheel line
# CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y

# Uncomment the following line to enable the OLED Display
CONFIG_ZMK_DISPLAY=y

# nice!view screens via zmk-nice-oled (nice_epaper shield)
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
# Left: layer + modifiers (macOS symbols); no WPM / bongo cat animation to save battery
CONFIG_NICE_OLED_WIDGET_LAYER=y
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS=y
CONFIG_NICE_OLED_WIDGET_WPM=n
# Right: gem animation; cat must be off because it takes precedence over gem
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_CAT=n
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_GEM=y
# Full cycle of 16 gem frames: 160 s, i.e. a new frame every 10 s
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_MS=160000

# Uncomment the following lines to enable RGB underglow
# CONFIG_ZMK_RGB_UNDERGLOW=y

# Increase BLE transmit power
# CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Better OS compatability (especially for macOS and iPadOS)
CONFIG_ZMK_HID_CONSUMER_REPORT_USAGES_BASIC=y
